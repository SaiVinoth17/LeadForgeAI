    const { useState, useEffect, useRef } = React;

    // ── 1. THREE.JS 3D SPATIAL RADAR GLOBE COMPONENT ────────────────────────
    function ThreeSpatialRadarGlobe() {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current) return;
        const width = containerRef.current.clientWidth;
        const height = containerRef.current.clientHeight || 280;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.z = 18;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(width, height);
        containerRef.current.appendChild(renderer.domElement);

        // 3D Wireframe Wire Sphere
        const geometry = new THREE.IcosahedronGeometry(7, 3);
        const material = new THREE.MeshBasicMaterial({
          color: 0x6366F1,
          wireframe: true,
          transparent: true,
          opacity: 0.25
        });
        const globe = new THREE.Mesh(geometry, material);
        scene.add(globe);

        // Particle Lead Nodes
        const particlesGeo = new THREE.BufferGeometry();
        const particleCount = 120;
        const posArray = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
          const u = Math.random();
          const v = Math.random();
          const theta = u * 2.0 * Math.PI;
          const phi = Math.acos(2.0 * v - 1.0);
          const r = 7.1;
          posArray[i] = r * Math.sin(phi) * Math.cos(theta);
          posArray[i + 1] = r * Math.sin(phi) * Math.sin(theta);
          posArray[i + 2] = r * Math.cos(phi);
        }

        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({
          size: 0.35,
          color: 0x34D399,
          transparent: true,
          opacity: 0.95
        });
        const particleSystem = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particleSystem);

        // Animation Loop
        let animId;
        const animate = () => {
          animId = requestAnimationFrame(animate);
          globe.rotation.y += 0.003;
          particleSystem.rotation.y += 0.003;
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(animId);
          if (containerRef.current && renderer.domElement) {
            containerRef.current.removeChild(renderer.domElement);
          }
        };
      }, []);

      return <div ref={containerRef} class="w-full h-[260px] relative overflow-hidden" />;
    }

    // ── 2. FORGE OS BOOT SCREEN SEQUENCE COMPONENT ─────────────────────────
    function ForgeOSBootScreen({ onComplete }) {
      const [step, setStep] = useState(0);
      const steps = [
        "Initializing Forge OS Core Engine (React 19 + Three.js)...",
        "Loading Autonomous AI Workforce (8 Agents)...",
        "Connecting FastAPI Asynchronous Provider Router...",
        "Indexing Spatial Lead QuadTree & 3D Radar...",
        "Building Proactive Daily Brief & Revenue Forecast...",
        "FORGE OS V5 READY ✓"
      ];

      useEffect(() => {
        const timer = setInterval(() => {
          setStep((prev) => {
            if (prev >= steps.length - 1) {
              clearInterval(timer);
              setTimeout(onComplete, 400);
              return prev;
            }
            return prev + 1;
          });
        }, 380);

        return () => clearInterval(timer);
      }, []);

      return (
        <div class="fixed inset-0 bg-[#0A0C10] z-50 flex flex-col items-center justify-center p-6 text-center">
          <div class="w-full max-w-md p-8 glass-card border border-indigo-500/30 rounded-2xl shadow-2xl glow-primary">

            <p class="text-xs uppercase tracking-widest text-gray-400 mb-6">AUTONOMOUS AI OPERATING SYSTEM</p>
            
            <p class="text-sm font-medium text-gray-200 mb-4 h-6">{steps[step]}</p>
            
            <div class="w-full bg-gray-800 rounded-full h-2.5 mb-6 overflow-hidden">
              <div
                class="bg-indigo-500 h-2.5 rounded-full transition-all duration-300 ease-out"
                style={{ width: `${((step + 1) / steps.length) * 100}%` }}
              ></div>
            </div>

            <div class="flex justify-between items-center text-[10px] text-gray-500 uppercase tracking-wider">
              <span>Latency: 12ms</span>
              <span>React 19 + Three.js + FastAPI</span>
              <span>Encrypted</span>
            </div>
          </div>
        </div>
      );
    }
